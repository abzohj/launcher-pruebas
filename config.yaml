baseURL: https://www.alvaropquiroga.com/
locale: es-es
build:
  writeStats: true
title: Alvaro P. Quiroga



params:
  author: Alvaro P. Quiroga
  description: Portfolio y blog de Alvaro P. Quiroga
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
    - item: experiences
    - item: otra_experiencia
    - item: education
    - item: projects
    - item: voluntariado
    - item: skills
      panel_id: skill-panel
    - item: hobbies

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
